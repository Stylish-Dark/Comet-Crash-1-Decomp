name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m compileall -q tools tests
      - run: python tools/repo_safety.py

  windows-scaffold:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ninja
          $lock = Get-Content config/ps3recomp.lock | ConvertFrom-StringData
          git clone $lock.repository external/ps3recomp
          git -C external/ps3recomp checkout --detach $lock.commit
          python -m pip install -r external/ps3recomp/requirements.txt

      - name: Run unit suite on Windows
        shell: pwsh
        run: |
          python -m unittest discover -v
          python -m compileall -q tools tests
          python tools/repo_safety.py

      - name: Apply pinned Comet runtime patches
        shell: pwsh
        run: |
          python tools/patch_ps3recomp_host.py external/ps3recomp
          python tools/patch_ps3recomp_spurs.py external/ps3recomp
          python tools/patch_ps3recomp_vfs.py external/ps3recomp
          python tools/patch_ps3recomp_resc.py external/ps3recomp
          python tools/patch_ps3recomp_gcm.py external/ps3recomp

      - name: Stage synthetic generated-code fixtures
        shell: pwsh
        run: python tools/make_ci_scaffold.py --ps3recomp external/ps3recomp

      - name: Compile and link Windows port scaffold
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          if not defined VSROOT exit /b 3
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          for /f "delims=" %%I in ('python -c "import ninja; print(ninja.BIN_DIR)"') do set "NINJA_DIR=%%I"
          cmake -S port -B build-ci -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_MAKE_PROGRAM:FILEPATH="%NINJA_DIR%\ninja.exe" -DPS3RECOMP_DIR="%GITHUB_WORKSPACE%\external\ps3recomp" -DRECOMP_DIR="%GITHUB_WORKSPACE%\generated\ci\recompiled" -DSPU_LIFTED_DIR="%GITHUB_WORKSPACE%\generated\ci\spu" -DSPU_REGISTRY="%GITHUB_WORKSPACE%\generated\ci\spu_workloads.c"
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build-ci
          if errorlevel 1 exit /b %errorlevel%
          if not exist build-ci\CometCrashPC.exe exit /b 4

      - name: Verify linked EXE provenance integration
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import sys; sys.path.insert(0,'tools'); import comet_port as c; pin=c.load_ps3recomp_lock()['commit']; h={'imports':171,'covered_imports':171,'missing':[]}; p=c.make_build_provenance(project_root=Path('.'),ps3recomp_commit=pin,hle=h,recomp=Path('generated/ci/recompiled'),spu=Path('generated/ci/spu'),executable=Path('build-ci/CometCrashPC.exe')); f=c.write_build_provenance(Path('build-ci'),p); c.verify_build_provenance(f,Path('build-ci/CometCrashPC.exe'),Path('.'),pin); print('linked EXE provenance: verified')"

      - name: Prepare downloadable CI scaffold notice
        shell: pwsh
        run: |
          @"
          CometCrashPC CI SCAFFOLD - NOT A PLAYABLE COMET CRASH BUILD

          This executable is compiled against non-proprietary synthetic PPU/SPU
          fixtures solely to prove that the Windows host/runtime links correctly.
          It does NOT contain the recompiled Comet Crash game code and is not the
          executable to use for gameplay testing.

          Use the CometCrashPC-Windows-Builder artifact instead. It builds the real
          executable locally from your own legally obtained NPEB00142 v1.00 files.
          "@ | Set-Content -Encoding UTF8 build-ci\README-NOT-PLAYABLE.txt

      - name: Upload CI scaffold executable
        uses: actions/upload-artifact@v4
        with:
          name: CometCrashPC-ci-scaffold
          if-no-files-found: error
          retention-days: 14
          path: |
            build-ci/CometCrashPC.exe
            build-ci/build_provenance.json
            build-ci/README-NOT-PLAYABLE.txt

      - name: Prepare portable Windows builder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force delivery | Out-Null
          git bundle create delivery/CometCrashPC-source.bundle HEAD
          Copy-Item scripts/portable_builder.cmd delivery/BUILD_AND_RUN.cmd
          @"
          COMET CRASH PC - WINDOWS BUILDER

          This package contains NO Comet Crash game files.

          1. Extract this artifact.
          2. Drag your extracted NPEB00142 v1.00 game folder onto BUILD_AND_RUN.cmd,
             or run:
                BUILD_AND_RUN.cmd "D:\Games\Comet Crash"
          3. The script creates a clean source checkout, reconstructs/lifts your
             locally owned game data, builds the real native executable, and launches it.
          4. The real executable will be:
                CometCrashPC-src\build\CometCrashPC.exe

          Required on Windows:
          - Visual Studio 2022 / Build Tools: Desktop C++, Clang tools, Windows SDK
          - Git
          - Python 3
          - CMake

          The game EBOOT/ELF/assets remain local and are never included in this artifact.
          "@ | Set-Content -Encoding UTF8 delivery/README.txt

      - name: Upload Windows builder
        uses: actions/upload-artifact@v4
        with:
          name: CometCrashPC-Windows-Builder
          if-no-files-found: error
          retention-days: 30
          path: |
            delivery/CometCrashPC-source.bundle
            delivery/BUILD_AND_RUN.cmd
            delivery/README.txt

  linux-cross-windows:
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20260922"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install cross-build dependencies
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ninja
          sudo apt-get update
          sudo apt-get install -y xz-utils
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-24.04-x86_64.tar.xz"
          curl -L --fail --retry 3 "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${archive}" -o "$RUNNER_TEMP/${archive}"
          tar -xJf "$RUNNER_TEMP/${archive}" --strip-components=1 -C "$RUNNER_TEMP/llvm-mingw"
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lock={}
          for line in Path("config/ps3recomp.lock").read_text().splitlines():
              line=line.strip()
              if line and not line.startswith("#") and "=" in line:
                  k,v=line.split("=",1); lock[k.strip()]=v.strip()
          subprocess.run(["git","clone",lock["repository"],"external/ps3recomp"],check=True)
          subprocess.run(["git","-C","external/ps3recomp","checkout","--detach",lock["commit"]],check=True)
          PY
          python -m pip install -r external/ps3recomp/requirements.txt

      - name: Apply pinned Comet patches
        run: |
          python tools/patch_ps3recomp_host.py external/ps3recomp
          python tools/patch_ps3recomp_spurs.py external/ps3recomp
          python tools/patch_ps3recomp_vfs.py external/ps3recomp
          python tools/patch_ps3recomp_resc.py external/ps3recomp
          python tools/patch_ps3recomp_gcm.py external/ps3recomp

      - name: Stage synthetic generated-code fixtures
        run: python tools/make_ci_scaffold.py --ps3recomp external/ps3recomp

      - name: Cross-compile Windows scaffold from Linux
        shell: bash
        run: |
          cmake -S port -B build-cross -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/llvm-mingw-x86_64.cmake" \
            -DPS3RECOMP_DIR="$GITHUB_WORKSPACE/external/ps3recomp" \
            -DRECOMP_DIR="$GITHUB_WORKSPACE/generated/ci/recompiled" \
            -DSPU_LIFTED_DIR="$GITHUB_WORKSPACE/generated/ci/spu" \
            -DSPU_REGISTRY="$GITHUB_WORKSPACE/generated/ci/spu_workloads.c"
          cmake --build build-cross
          test -f build-cross/CometCrashPC.exe
          file build-cross/CometCrashPC.exe
